<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A1B10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brew Log">
<meta name="description" content="Brew day, fermentation and packaging logs, brewing calculators and reference for homebrewers. Works offline, nothing leaves your phone.">
<link rel="manifest" href="manifest.webmanifest?v=1.6.0">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>Brew Log</title>
<style>
:root{
  --ink:#2A1B10; --panel:#3A2716; --panel2:#47301C; --line:#5C4026; --text:#F3F6FA; --muted:#A3B4CE;
  --amber:#F2A03D; --amberInk:#1B1407; --ok:#5BC98F; --bad:#EF7B7B; --warn:#F2C94C;
  --sans:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --radius:6px; --nav:64px;
}
*{box-sizing:border-box}
html{background:var(--ink);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
a{color:var(--amber)}
header.top{position:sticky;top:0;z-index:5;background:var(--ink);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
header.top h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.01em}
header.top .spacer{flex:1}
header.top .chip{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:16px 16px 24px}
h2{font-size:22px;font-weight:600;margin:4px 0 12px;line-height:1.2}
h3{font-size:16px;font-weight:600;margin:20px 0 8px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono)}
.list{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line)}
.list button,.list a{width:100%;text-align:left;background:none;border:0;color:var(--text);font:inherit;padding:14px 4px;display:flex;align-items:center;gap:12px;cursor:pointer;min-height:52px}
.list .t{flex:1}
.list .t b{display:block;font-weight:600}
.list .t span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.list .k{color:var(--muted);font-size:20px;line-height:1}
.back{background:none;border:0;color:var(--amber);font:inherit;font-size:15px;padding:0 0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:var(--radius);padding:12px;font:inherit;font-size:17px;min-height:48px}
.field input.mono,.field textarea.mono{font-family:var(--mono);font-size:16px}
.field textarea{min-height:88px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.readout{background:var(--amber);color:var(--amberInk);border-radius:var(--radius);padding:14px 16px;margin:8px 0 16px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.readout .line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-bottom:1px solid rgba(0,0,0,.12)}
.readout .line:last-child{border-bottom:0}
.readout .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.readout .l{font-size:14px;font-weight:600}
.readout .n{display:block;font-size:12px;font-weight:400;opacity:.85}
.readout .bad .v{color:#7A1F1F}
.readout .ok .v{color:#0F5A34}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--radius);border:1px solid var(--amber);background:var(--amber);color:var(--amberInk);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.secondary{background:transparent;color:var(--text);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%;margin:6px 0}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;font-family:var(--mono)}
.chip.on{background:var(--amber);color:var(--amberInk);border-color:var(--amber)}
.tablewrap{overflow-x:auto;margin:0 -16px 16px;padding:0 16px}
table.ref{border-collapse:collapse;width:100%;font-size:14px;min-width:480px}
table.ref th,table.ref td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.ref th{color:var(--muted);font-weight:600;font-size:13px}
table.ref td.mono{font-family:var(--mono);font-size:13px;white-space:nowrap}
details.plat{border-top:1px solid var(--line);padding:4px 0}
details.plat summary{cursor:pointer;padding:12px 4px;font-weight:600;list-style:none;display:flex;align-items:center;min-height:48px}
details.plat summary::-webkit-details-marker{display:none}
details.plat summary::after{content:"+";margin-left:auto;color:var(--muted);font-size:20px}
details.plat[open] summary::after{content:"\2013"}
details.plat .body{padding:0 4px 16px}
details.plat .body h4{margin:12px 0 6px;font-size:14px;color:var(--muted);font-weight:600}
details.plat .body ol,details.plat .body ul{margin:0;padding-left:20px}
details.plat .body li{margin:0 0 6px}
details.plat .fault b{display:block}
.note{border-left:3px solid var(--amber);padding:8px 12px;margin:12px 0;color:var(--muted);font-size:14px}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:20px 16px;color:var(--muted);text-align:center;margin:12px 0}
.preview{width:100%;border-radius:var(--radius);border:1px solid var(--line);display:block;margin:8px 0}
.progress{height:6px;background:var(--panel);border-radius:3px;overflow:hidden;margin:8px 0 12px}
.progress i{display:block;height:100%;background:var(--amber);width:0;transition:width .2s}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:var(--panel);flex:none}
.thumb.sm{width:40px;height:40px}
.photo{width:100%;max-width:420px;aspect-ratio:4/3;object-fit:cover;border-radius:var(--radius);border:1px solid var(--line);display:block;margin:4px 0 6px}
.photo-slot{display:inline-block}
.swatch{display:inline-block;width:16px;height:16px;border-radius:3px;border:1px solid rgba(0,0,0,.35);vertical-align:-3px;margin-right:8px}
.bar{height:8px;border-radius:4px;background:var(--panel2);position:relative;margin:6px 0 2px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;background:var(--amber);border-radius:4px}
.bar b{position:absolute;top:-3px;width:2px;height:14px;background:var(--text)}
.timer{font-family:var(--mono);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;padding:6px 0}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.step .t{flex:1}
.step .tm{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:56px}
.step.done .t{color:var(--muted)}
.step.done .ttl{text-decoration:line-through}
.step .ins{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.step .ins label{flex:1 1 130px;min-width:0}
.step .ins label span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.step .ins input{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:var(--radius);padding:9px 10px;font:inherit;font-size:16px;min-height:42px}
.step .act{background:none;border:1px solid var(--line);border-radius:var(--radius);color:var(--amber);font:inherit;font-weight:600;padding:8px 12px;cursor:pointer;min-height:42px;align-self:flex-start}
.badge.due,.badge.overdue,.badge.ok{margin-right:8px}
.photo-slot.thumb,.photo-slot.thumb.sm{background:var(--panel)}
.photo-slot.photo{display:none}
.rec{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.rec .t{flex:1;min-width:0}
.rec .t b{display:block}
.rec .t .mono{color:var(--muted);font-size:13px;word-break:break-all}
.rec .t .meta{color:var(--muted);font-size:13px}
.rec .act{background:none;border:0;color:var(--amber);font:inherit;padding:8px;cursor:pointer;min-height:44px}
.badge{display:inline-block;font-size:12px;border-radius:4px;padding:2px 6px;background:var(--panel2);color:var(--text);margin-right:6px;font-weight:600}
.badge.overdue{background:var(--bad);color:#2A0808}
.badge.due{background:var(--warn);color:#2A2005}
.badge.ok{background:var(--ok);color:#06301B}
.badge.never{background:var(--panel2)}
pre.pkg{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-word;max-height:40vh;overflow:auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--ink);border-top:1px solid var(--line);display:flex;z-index:5}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:6px 0}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--amber)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:9;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.lock{border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:12px 0}
.zoomable{cursor:zoom-in}
.lightbox{position:fixed;inset:0;z-index:20;background:rgba(20,12,6,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.lightbox-frame{max-width:100%;max-height:78vh;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:center;justify-content:center}
.lightbox-img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:var(--radius);cursor:zoom-in;transition:none}
.lightbox-frame.zoomed{align-items:flex-start;justify-content:flex-start}
.lightbox-frame.zoomed .lightbox-img{max-width:none;max-height:none;width:200%;cursor:zoom-out}
.lightbox-cap{color:var(--text);max-width:720px;text-align:center;margin-top:10px;font-size:14px}
.lightbox-cap p{margin:4px 0}
.lightbox-close{position:absolute;top:calc(8px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:26px;line-height:1;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:720px){main{padding:24px}}
</style>
</head>
<body>
<header class="top">
  <h1>Brew Log</h1>
  <span class="spacer"></span>
  <span class="chip" id="jobChip" hidden></span>
  <button class="btn secondary" id="installBtn" hidden style="min-height:36px;padding:0 12px;font-size:14px">Install</button>
  <button class="btn secondary" id="gearBtn" aria-label="Settings" style="min-height:36px;padding:0 10px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-tab="batches"><svg viewBox="0 0 24 24"><path d="M9 3h6v5l4 9a3 3 0 0 1-2.8 4H7.8A3 3 0 0 1 5 17l4-9z"/><path d="M8 14h8"/></svg>Batches</button>
  <button data-tab="brewday"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l3 2M9 2h6"/></svg>Brew day</button>
  <button data-tab="calc"><svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M16 15h0M8 19h6"/></svg>Calc</button>
  <button data-tab="ref"><svg viewBox="0 0 24 24"><path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 0-3 3z"/><path d="M4 4v16M9 8h6M9 12h6"/></svg>Reference</button>
  <button data-tab="stock"><svg viewBox="0 0 24 24"><path d="M3 7h18v13H3z"/><path d="M3 7l2-4h14l2 4M9 11h6"/></svg>Stock</button>
  <button data-tab="shop"><svg viewBox="0 0 24 24"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 2H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>Shop</button>
</nav>
<script src="recipes.js?v=1.6.0"></script>
<script src="beerxml.js?v=1.6.0"></script>
<script src="data.js?v=1.6.0"></script>
<script src="shop.js?v=1.6.0"></script>
<script src="core.js?v=1.6.0"></script>
<script src="app.js?v=1.6.0"></script>
</body>
</html>
